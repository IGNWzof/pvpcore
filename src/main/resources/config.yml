prefix: "&8[&bParty&8] &r"
max-party-size: 4
invite-timeout-seconds: 60
fight-timeout-seconds: 60
require-equal-size: true

# kit id used when none is given to /party fight or /party ffa (empty = first PvPCore kit)
default-kit: ""

# Gamemode select menu (Party Battle -> Team Battle / Party FFA), like mcpvp.club's.
# Leave "kits" empty to show every PvPCore kit; list specific kit ids to restrict that menu.
gamemodes:
  team:
    kits: []
  ffa:
    kits: []
    min-players: 2
